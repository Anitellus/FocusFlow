<body class="bg-slate-50 text-slate-800 h-screen overflow-hidden flex flex-col md:flex-row selection:bg-brand-100 selection:text-brand-900">

    <!-- MOBILE TOP BAR (Visible only on screens < 768px) -->
    <header class="md:hidden flex items-center justify-between px-4 py-3 bg-white border-b border-slate-200 z-30 shrink-0">
        <div class="flex items-center gap-2 font-bold text-brand-600 text-lg">
            <i data-lucide="layers" class="w-6 h-6"></i>
            <span>Focus Flow</span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="toggleScratchpadModal()" class="p-2 bg-indigo-50 text-brand-600 rounded-xl" title="Scratchpad">
                <i data-lucide="edit-3" class="w-4 h-4"></i>
            </button>
            <button onclick="toggleMobileSidebar()" class="p-2 bg-slate-100 text-slate-700 rounded-xl" title="Open Navigation Menu">
                <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- MOBILE DRAWER BACKDROP -->
    <div id="sidebar-backdrop" onclick="closeMobileSidebar()" class="fixed inset-0 bg-slate-950/40 backdrop-blur-xs z-40 hidden md:hidden"></div>

    <!-- SIDEBAR NAVIGATION DRAWER (Slide-out on Mobile, Static on Desktop) -->
    <aside id="sidebar-drawer" class="fixed md:static inset-y-0 left-0 w-80 bg-slate-100/95 border-r border-slate-200 flex flex-col backdrop-blur-xl shrink-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="p-6 border-b border-slate-200/60 flex items-center justify-between">
            <button onclick="toggleInstructionsModal()" class="flex items-center gap-3 text-brand-600 font-bold text-xl tracking-tight text-left focus:outline-none group">
                <i data-lucide="layers" class="w-7 h-7 group-hover:scale-110 transition-transform"></i>
                <span>Focus Flow</span>
                <i data-lucide="help-circle" class="w-4 h-4 text-slate-400 group-hover:text-brand-600 transition-colors"></i>
            </button>
            <button onclick="closeMobileSidebar()" class="md:hidden text-slate-400 hover:text-slate-600 p-1.5 rounded-lg">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <div class="px-3 py-3 flex gap-1.5 border-b border-slate-200/60 font-sans-ui">
            <button onclick="switchView('focus')" id="nav-focus" class="flex-1 py-2 rounded-xl text-xs font-bold bg-white text-brand-600 shadow-sm ring-1 ring-slate-200 transition-all flex justify-center items-center gap-1">
                <i data-lucide="target" class="w-3.5 h-3.5"></i> Focus
            </button>
            <button onclick="switchView('calendar')" id="nav-calendar" class="flex-1 py-2 rounded-xl text-xs font-medium text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-all flex justify-center items-center gap-1">
                <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Calendar
            </button>
            <button onclick="switchView('analytics')" id="nav-analytics" class="flex-1 py-2 rounded-xl text-xs font-medium text-slate-500 hover:bg-slate-200 hover:text-slate-700 transition-all flex justify-center items-center gap-1">
                <i data-lucide="bar-chart-2" class="w-3.5 h-3.5"></i> Analytics
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto p-3 space-y-1 font-sans-ui" id="project-list-container"></div>

        <div class="p-4 border-t border-slate-200/60 bg-white/50 space-y-2 font-sans-ui">
            <button onclick="createNewProject()" class="w-full py-2.5 bg-brand-600 text-white rounded-xl font-semibold text-xs hover:bg-brand-500 hover:shadow-md transition-all flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> New Root Project
            </button>
            <button onclick="manualCloudSave()" id="btn-manual-save" class="w-full py-2 bg-emerald-600 text-white rounded-xl font-semibold text-xs hover:bg-emerald-500 transition-all flex items-center justify-center gap-2 shadow-sm">
                <i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> Save State to Cloud
            </button>
            <div class="flex gap-2">
                <button onclick="exportDataJSON()" class="flex-1 py-2 bg-white border border-slate-200 shadow-sm rounded-xl text-slate-600 text-[11px] font-semibold hover:text-brand-600 transition-all flex items-center justify-center gap-1">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> Backup
                </button>
                <input type="file" id="import-file-input" accept=".json" onchange="importDataJSON(event)" class="hidden">
                <button onclick="document.getElementById('import-file-input').click()" class="flex-1 py-2 bg-white border border-slate-200 shadow-sm rounded-xl text-slate-600 text-[11px] font-semibold hover:text-brand-600 transition-all flex items-center justify-center gap-1">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> Restore
                </button>
            </div>
        </div>
    </aside>
