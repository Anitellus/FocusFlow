    <!-- BACK-END LOGIC & FIREBASE SYNC ENGINE -->
    <script>
        // --- 1. Firebase Initialization & Sync Setup ---
        const STORAGE_KEY = 'focus_flow_master_v9';

        const firebaseConfig = {
            apiKey: "AIzaSyCzpHlAhANEmgZd3tMsfTnHGlbaK9L9sIM",
            authDomain: "focus-flow-app-87591.firebaseapp.com",
            projectId: "focus-flow-app-87591",
            storageBucket: "focus-flow-app-87591.firebasestorage.app",
            messagingSenderId: "233299198976",
            appId: "1:233299198976:web:721adeec2947aa06d384e5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const docRef = db.collection('focus_flow').doc('user_workspace');

        let appState = {
            activeProjectId: null,
            audioFamily: 'woodblock',
            audioVolume: 80,
            audioMuted: false,
            bloomOpacity: 60,
            pickerPrimary: '#090d16',
            pickerSecondary: '#1e1b4b',
            pickerTertiary: '#4338ca',
            selectPattern: 'radial-center',
            mascotBehavior: 'roam',
            mascotScale: 1.0,
            hideUnlockBtn: false,
            jitterAudioBase: 300,
            jitterAudioWindow: 30,
            collapsedProjects: {},
            projects: []
        };

        // Load local state immediately to avoid startup delay
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try { appState = Object.assign(appState, JSON.parse(saved)); } catch(e) {}
        }
        if (!appState.projects || appState.projects.length === 0) {
            loadDefaultData();
        }

        function loadDefaultData() {
            const initialId = 'proj-' + generateId();
            appState.activeProjectId = initialId;
            appState.projects = [{
                id: initialId,
                parentId: null,
                title: 'Core Production Module',
                goal: 'Ship production ready client build',
                deadline: '',
                notes: '',
                totalTimeSpent: 0,
                activeTaskId: 't-1',
                activeMascotId: 'm-shiba',
                tasks: [{ id: 't-1', title: 'Verify custom matrix SVGs', estimatedTime: 1800, actualTime: 0, isCompleted: false }]
            }];
            saveStateLocally();
        }

        // Local State Save (Instant)
        function saveStateLocally() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        }

        // Manual Cloud Save Button Action
        function manualCloudSave() {
            const btn = document.getElementById('btn-manual-save');
            if(btn) btn.innerHTML = `<i data-lucide="loader" class="w-3.5 h-3.5 animate-spin"></i> Saving...`;
            safeCreateIcons();

            const cleanData = JSON.parse(JSON.stringify(appState));
            docRef.set(cleanData, { merge: true }).then(() => {
                if(btn) btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Saved to Cloud!`;
                safeCreateIcons();
                setTimeout(() => {
                    if(btn) btn.innerHTML = `<i data-lucide="cloud-upload" class="w-3.5 h-3.5"></i> Save State to Cloud`;
                    safeCreateIcons();
                }, 2500);
            }).catch(err => {
                console.error("Cloud Save Error:", err);
                if(btn) btn.innerHTML = `Save Failed`;
            });
        }

        // Automatic Background Cloud Sync Interval (Every 5 Minutes)
        setInterval(() => {
            const cleanData = JSON.parse(JSON.stringify(appState));
            docRef.set(cleanData, { merge: true }).catch(err => console.warn("Auto-sync background error:", err));
        }, 5 * 60 * 1000);

        // Real-Time Listener: Syncs across devices without local loops
        docRef.onSnapshot((doc) => {
            if (doc.metadata && doc.metadata.hasPendingWrites) return;
            if (doc.exists) {
                const cloudData = doc.data();
                if (cloudData && Array.isArray(cloudData.projects) && cloudData.projects.length > 0) {
                    appState = Object.assign(appState, cloudData);
                    saveStateLocally();
                    renderApp();
                }
            }
        });

        // Operational Variables
        let isPlaying = false, timerInterval = null, tickCounter = 0;
        function saveState() { saveStateLocally(); } // Alias compatibility
        function getActiveProject() { return appState.projects.find(p => p.id === appState.activeProjectId) || appState.projects[0]; }
        function getRootProject(proj) {
            let curr = proj;
            while (curr && curr.parentId) {
                const parent = appState.projects.find(p => p.id === curr.parentId);
                if (!parent) break;
                curr = parent;
            }
            return curr;
        }
        function getActiveTask() { 
            const p = getActiveProject(); 
            return p ? p.tasks.find(t => t.id === p.activeTaskId) : null; 
        }
        function generateId() { return Math.random().toString(36).substr(2, 9); }
        function hasSubProjects(projectId) { return appState.projects.some(p => p.parentId === projectId); }
        function getCumulativeTime(projectId) {
            const p = appState.projects.find(x => x.id === projectId);
            if (!p) return 0;
            let total = p.totalTimeSpent || 0;
            appState.projects.filter(sp => sp.parentId === projectId).forEach(sp => { total += getCumulativeTime(sp.id); });
            return total;
        }
        function formatTimeCompact(sec) {
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
            return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }
        function formatTimeFull(sec) {
            const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
            return h > 0 ? `${h}h ${m}m` : `${m}m`;
        }
        function safeCreateIcons() { try { lucide.createIcons(); } catch(e) {} }

        // --- Timer Engine (Fixed: No Firestore Spam on Tick) ---
        function toggleTimer() {
            const task = getActiveTask(); if (!task || task.isCompleted) return;
            isPlaying = !isPlaying; renderTimerVisuals();
            if (isPlaying) { 
                timerInterval = setInterval(timerTick, 1000); 
            } else { 
                clearInterval(timerInterval); 
                saveStateLocally(); 
            }
        }

        function timerTick() {
            const p = getActiveProject(), t = getActiveTask();
            if (!t || t.isCompleted) { if (isPlaying) toggleTimer(); return; }
            t.actualTime += 1; p.totalTimeSpent += 1; 
            // Update local storage cache only — preventing Firestore rapid write locks
            saveStateLocally();
            updateTimerTexts(p, t);
        }

        function completeActiveTask() {
            const t = getActiveTask(), p = getActiveProject(); if (!t || t.isCompleted) return;
            if (isPlaying) toggleTimer(); 
            t.isCompleted = true; 
            t.completionDate = new Date().toISOString(); 
            confetti({ particleCount: 80, spread: 60 }); 
            saveStateLocally();
            setTimeout(() => { p.activeTaskId = (p.tasks.find(x => !x.isCompleted) || {}).id || null; saveStateLocally(); renderApp(); }, 1000);
            renderApp();
        }

        function handleAddTask() {
            const input = document.getElementById('new-task-title-input'), estInput = document.getElementById('new-task-est-input');
            const title = input.value.trim(), estMins = parseInt(estInput.value);
            const p = getActiveProject();
            if (hasSubProjects(p.id)) { alert("Tasks can only exist at the lowest project level."); return; }
            if (!title) return;
            if (!estMins || estMins <= 0) { alert("Target Time required!"); estInput.focus(); return; }
            p.tasks.push({ id: 't-' + generateId(), title: title, estimatedTime: estMins * 60, actualTime: 0, isCompleted: false, deadline: '', notes: '' });
            if (!p.activeTaskId) p.activeTaskId = p.tasks[p.tasks.length - 1].id;
            input.value = ''; estInput.value = ''; saveStateLocally(); renderApp();
        }

        function deleteTask(taskId, e) {
            if (e) e.stopPropagation();
            const p = getActiveProject(); if (!p) return;
            p.tasks = p.tasks.filter(t => t.id !== taskId);
            if (p.activeTaskId === taskId) p.activeTaskId = p.tasks.length > 0 ? p.tasks[0].id : null;
            saveStateLocally(); renderApp();
        }

        function createNewProject(parentId = null) {
            const id = 'proj-' + generateId();
            appState.projects.push({
                id, parentId, title: parentId ? 'New Sub-Project' : 'New Root Project',
                goal: '', deadline: '', notes: '', totalTimeSpent: 0, activeTaskId: null, activeMascotId: null, tasks: []
            });
            appState.activeProjectId = id;
            saveStateLocally(); renderApp();
        }

        // --- Render Engine ---
        function renderApp() {
            const p = getActiveProject(); if (!p) return;
            renderSidebar(); renderHeader(p); renderActiveTask(p); renderMascotStage(); renderTaskList(p); safeCreateIcons();
        }

        function renderSidebar() {
            const container = document.getElementById('project-list-container');
            container.innerHTML = appState.projects.filter(p => !p.parentId).map(p => {
                const isActive = p.id === appState.activeProjectId;
                return `<div onclick="selectProject('${p.id}')" class="p-2.5 rounded-xl cursor-pointer font-bold text-xs ${isActive ? 'bg-white shadow-sm ring-1 ring-slate-200 text-slate-900' : 'hover:bg-slate-200/50 text-slate-700'}">${p.title}</div>`;
            }).join('');
        }

        function renderHeader(p) {
            document.getElementById('project-title-input').value = p.title || '';
            document.getElementById('project-goal-input').value = p.goal || '';
            document.getElementById('project-deadline-input').value = p.deadline || '';
            document.getElementById('project-notes-summary-input').value = p.notes || '';
            document.getElementById('project-cumulative-timer').textContent = formatTimeCompact(getCumulativeTime(p.id));
        }

        function renderActiveTask(p) {
            const task = getActiveTask();
            document.getElementById('active-task-title').textContent = task ? task.title : 'Select a task to begin';
            updateTimerTexts(p, task || { actualTime: 0, estimatedTime: 0 });
        }

        function updateTimerTexts(p, task) {
            document.getElementById('active-timer-display').textContent = formatTimeCompact(task.actualTime);
            document.getElementById('project-cumulative-timer').textContent = formatTimeCompact(getCumulativeTime(p.id));
            const zenDisplay = document.getElementById('zen-timer-display'); 
            if (zenDisplay) zenDisplay.textContent = formatTimeCompact(task.actualTime);
        }

        function renderMascotStage() {
            const activeProject = getActiveProject();
            const rootProj = getRootProject(activeProject);
            const activeMascotId = rootProj.activeMascotId;
            const mainMountWrapper = document.getElementById('main-mascot-mount-wrapper');
            const mainMount = document.getElementById('main-mascot-mount');

            if (!activeMascotId) {
                if(mainMountWrapper) mainMountWrapper.classList.add('hidden');
                if(mainMount) mainMount.innerHTML = "";
            } else {
                const activeMascot = mascotDatabase.find(m => m.id === activeMascotId) || mascotDatabase[0];
                if(mainMountWrapper) mainMountWrapper.classList.remove('hidden');
                if(mainMount) mainMount.innerHTML = `<div class="w-16 h-16 flex items-center justify-center">${activeMascot.svg}</div>`;
            }

            const grid = document.getElementById('mascot-gallery-grid'); if (!grid) return;
            grid.innerHTML = mascotDatabase.map(m => {
                const isSelected = m.id === activeMascotId;
                return `<div onclick="selectMascotCompanion('${m.id}')" class="p-2.5 rounded-xl border-2 cursor-pointer flex flex-col items-center ${isSelected ? 'border-indigo-500 bg-indigo-50' : 'border-slate-200 bg-slate-50'}">
                    <div class="w-12 h-12 flex items-center justify-center">${m.svg}</div>
                    <div class="text-[11px] font-bold text-slate-800 mt-1">${m.name}</div>
                </div>`;
            }).join('');
        }

        function renderTaskList(p) {
            const container = document.getElementById('task-list-container');
            document.getElementById('task-progress-text').textContent = `${p.tasks.filter(t => t.isCompleted).length}/${p.tasks.length} Completed`;
            container.innerHTML = p.tasks.map((t, idx) => `
                <div class="flex items-center gap-3 p-3 bg-white rounded-2xl shadow-sm border border-slate-200">
                    <span class="text-xs font-bold font-mono text-slate-400">${idx + 1}</span>
                    <div class="flex-1 cursor-pointer" onclick="selectTask('${t.id}')">
                        <p class="text-xs font-semibold ${t.isCompleted ? 'line-through text-slate-400' : ''}">${t.title}</p>
                    </div>
                    <button onclick="deleteTask('${t.id}', event)" class="p-1 text-slate-400 hover:text-rose-600"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    <span class="text-xs font-mono text-slate-500">${formatTimeCompact(t.actualTime)}</span>
                </div>`).join('');
        }

        function renderTimerVisuals() {
            const mainBtn = document.getElementById('main-timer-btn');
            if (mainBtn) mainBtn.className = `relative flex flex-col items-center justify-center w-72 h-72 sm:w-80 sm:h-80 rounded-full border-[10px] transition-all duration-300 cursor-pointer ${isPlaying ? 'timer-green-container' : 'timer-red-container'}`;
        }

        function selectProject(id) { appState.activeProjectId = id; renderApp(); }
        function selectTask(id) { getActiveProject().activeTaskId = id; renderApp(); }
        function selectMascotCompanion(id) { getRootProject(getActiveProject()).activeMascotId = id; saveStateLocally(); renderApp(); }
        function removeCompanion() { getRootProject(getActiveProject()).activeMascotId = null; saveStateLocally(); renderApp(); }
        function switchView(view) {
            document.getElementById('view-focus-container').classList.toggle('hidden', view !== 'focus');
            document.getElementById('view-analytics-container').classList.toggle('hidden', view !== 'analytics');
        }
        function openZenView() { document.getElementById('zen-overlay').classList.remove('hidden'); }
        function closeZenView() { document.getElementById('zen-overlay').classList.add('hidden'); }
        function toggleInstructionsModal() { document.getElementById('instructions-modal').classList.toggle('hidden'); }

        // Startup
        renderApp();
    </script>
</body>
</html>
